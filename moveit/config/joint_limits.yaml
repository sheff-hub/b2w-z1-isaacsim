# Velocity / acceleration limits for time parameterisation (rad/s, rad/s^2). The simulator's drives allow
# pi rad/s; requests scale these down (default 0.3).
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3
joint_limits:
  joint1: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
  joint2: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
  joint3: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
  joint4: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
  joint5: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
  joint6: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
  jointGripper: {has_velocity_limits: true, max_velocity: 3.14, has_acceleration_limits: true, max_acceleration: 4.0}
